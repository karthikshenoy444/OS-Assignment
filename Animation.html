<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Threaded Matrix Multiplication</title>
<style>
  :root {
    --bg: #12161c;
    --panel: #171c24;
    --border: #2a303a;
    --text: #dfe3e8;
    --dim: #6b7480;
    --amber: #e8a33d;
    --teal: #4fb3a9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto Mono', 'Courier New', monospace;
    padding: 32px 24px 48px;
    min-height: 100vh;
  }

  h1 {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--text);
  }

  .subtitle {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--dim);
    font-size: 0.85rem;
    margin: 0 0 28px;
    max-width: 640px;
    line-height: 1.5;
  }

  .layout {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .stage {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .matrix-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .matrix-label {
    font-size: 0.75rem;
    color: var(--dim);
    letter-spacing: 0.03em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
    background: var(--border);
    padding: 4px;
    border-radius: 6px;
  }

  .cell {
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    border-radius: 3px;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .cell.result {
    color: var(--dim);
  }

  .cell.active-a, .cell.active-b {
    background: rgba(232, 163, 61, 0.18);
    color: var(--amber);
  }

  .cell.done {
    background: rgba(79, 179, 169, 0.16);
    color: var(--teal);
    transform: scale(1.04);
  }

  .op {
    font-size: 1.3rem;
    color: var(--dim);
    padding-top: 24px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    width: 360px;
    min-height: 340px;
  }

  .panel-title {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.8rem;
    color: var(--dim);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }

  .log {
    font-size: 0.78rem;
    line-height: 1.65;
    height: 280px;
    overflow-y: auto;
  }

  .log-line {
    white-space: pre;
    opacity: 0;
    animation: fadeIn 0.2s ease forwards;
  }

  .log-line .thread-name { color: var(--amber); }
  .log-line .value { color: var(--teal); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .controls {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  button {
    background: var(--amber);
    color: #1a1a1a;
    border: none;
    padding: 9px 18px;
    border-radius: 5px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.4; cursor: default; }

  .status {
    font-size: 0.78rem;
    color: var(--dim);
  }
</style>
</head>
<body>

  <h1>Threaded Matrix Multiplication</h1>
  <p class="subtitle">
    Each cell of the result is an independent dot product, so each one is handed to its own thread.
    Watch the log — threads don't finish in row-by-row order, because the operating system schedules
    them however it likes.
  </p>

  <div class="layout">
    <div class="stage">
      <div class="matrix-block">
        <div class="matrix-label">A</div>
        <div class="grid" id="grid-a"></div>
      </div>
      <div class="op">×</div>
      <div class="matrix-block">
        <div class="matrix-label">B</div>
        <div class="grid" id="grid-b"></div>
      </div>
      <div class="op">=</div>
      <div class="matrix-block">
        <div class="matrix-label">C</div>
        <div class="grid" id="grid-c"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>THREAD ACTIVITY</span>
        <span id="thread-count">0 / 9 done</span>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="controls">
    <button id="run-btn">Run animation</button>
    <span class="status" id="status">Ready.</span>
  </div>

<script>
  const A = [[1,2,3],[4,5,6],[7,8,9]];
  const B = [[9,8,7],[6,5,4],[3,2,1]];

  function buildGrid(id, matrix, isResult) {
    const grid = document.getElementById(id);
    grid.innerHTML = '';
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (isResult ? ' result' : '');
        cell.textContent = isResult ? '' : matrix[r][c];
        cell.id = `${id}-${r}-${c}`;
        grid.appendChild(cell);
      }
    }
  }

  buildGrid('grid-a', A, false);
  buildGrid('grid-b', B, false);
  buildGrid('grid-c', null, true);

  const logEl = document.getElementById('log');
  const runBtn = document.getElementById('run-btn');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('thread-count');

  function logLine(html) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = html;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearHighlights() {
    document.querySelectorAll('.active-a, .active-b').forEach(el => {
      el.classList.remove('active-a', 'active-b');
    });
  }

  // Simulates one thread's lifetime: it "starts", highlights the row/column
  // it's reading from, does the math, then writes its result once — after
  // a random delay, just like real OS thread scheduling.
  function runCellThread(i, j, onDone) {
    const threadName = `Thread-C${i}${j}`;
    const startDelay = 80 + Math.random() * 900;

    setTimeout(() => {
      logLine(`<span class="thread-name">${threadName}</span> started — reading row ${i} of A, column ${j} of B`);

      for (let k = 0; k < 3; k++) {
        document.getElementById(`grid-a-${i}-${k}`).classList.add('active-a');
        document.getElementById(`grid-b-${k}-${j}`).classList.add('active-b');
      }

      const workTime = 250 + Math.random() * 500;
      setTimeout(() => {
        let total = 0;
        for (let k = 0; k < 3; k++) total += A[i][k] * B[k][j];

        for (let k = 0; k < 3; k++) {
          document.getElementById(`grid-a-${i}-${k}`).classList.remove('active-a');
          document.getElementById(`grid-b-${k}-${j}`).classList.remove('active-b');
        }

        const resultCell = document.getElementById(`grid-c-${i}-${j}`);
        resultCell.textContent = total;
        resultCell.classList.add('done');

        logLine(`<span class="thread-name">${threadName}</span> finished — C[${i}][${j}] = <span class="value">${total}</span>`);
        onDone();
      }, workTime);
    }, startDelay);
  }

  function runAnimation() {
    runBtn.disabled = true;
    statusEl.textContent = 'Threads running...';
    logEl.innerHTML = '';
    countEl.textContent = '0 / 9 done';
    buildGrid('grid-c', null, true);

    let done = 0;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        runCellThread(i, j, () => {
          done++;
          countEl.textContent = `${done} / 9 done`;
          if (done === 9) {
            statusEl.textContent = 'All threads joined. Result matrix complete.';
            runBtn.disabled = false;
          }
        });
      }
    }
  }

  runBtn.addEventListener('click', runAnimation);
</script>

</body>
</html>
